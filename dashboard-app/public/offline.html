<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#145c32">
  <title>Sem conexão | Hoje Supermercado</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f4f8f5; color: #183326; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 420px); padding: 32px 26px; border: 1px solid #dce9df; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 50px rgba(20, 92, 50, .1); }
    img { width: 76px; height: 76px; object-fit: contain; }
    h1 { margin: 18px 0 10px; font-size: 1.6rem; }
    p { margin: 0; color: #51655a; line-height: 1.6; }
    button { margin-top: 24px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 14px; background: #145c32; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/imagens/logo/app-icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>Conecte-se à internet para consultar os produtos, atualizar o carrinho e finalizar seu pedido.</p>
    <button type="button" onclick="window.location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
